name: Deploy Zenith Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e

            cd /home/deploy/zenith

            echo "Pulling latest code..."
            git pull origin main

            echo "Building Docker image..."
            docker build -t zenith-backend .

            echo "Stopping old container..."
            docker stop zenith-backend || true
            docker rm zenith-backend || true

            echo "Starting new container..."
            docker run -d \
              --name zenith-backend \
              --restart unless-stopped \
              --env-file /home/deploy/zenith/.env \
              -p 127.0.0.1:8000:8000 \
              zenith-backend

            echo "Checking container..."
            sleep 5
            docker ps --filter "name=zenith-backend"

            echo "Deployment complete."
