services:
  zenith-api:
    build: .
    container_name: zenith-api
    command: ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      - ZENITH_LLM_PROVIDER=${ZENITH_LLM_PROVIDER:-openai}
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - ZENITH_MODEL=${ZENITH_MODEL:-llama3.2:3b}
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-30m}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4.1-mini}
      - AUTH_SECRET_KEY=${AUTH_SECRET_KEY:-}
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/.cache/zenith.db}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-no-reply@zenith.local}
    volumes:
      - ./zenith:/app/zenith
      - ./backend:/app/backend
      - job_cache:/app/.cache
    restart: unless-stopped

  # Optional HTTPS front door for a production VM (e.g. Oracle Free Tier) that
  # has no purchased domain yet. sslip.io resolves <anything>-<ip>.sslip.io to
  # that IP, which lets Caddy obtain a real Let's Encrypt certificate for it.
  # Usage: docker compose --profile prod up -d caddy zenith-api
  #   1. Put your VM's public IP (dashes instead of dots) in Caddyfile, e.g.
  #      130-61-10-5.sslip.io
  #   2. Set BACKEND_URL on Vercel to https://130-61-10-5.sslip.io
  caddy:
    image: caddy:2
    container_name: zenith-caddy
    profiles: [prod]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    depends_on:
      - zenith-api
    restart: unless-stopped

volumes:
  job_cache:
  caddy_data:
